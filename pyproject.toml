[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdrw-agent"
version = "0.6.3"
description = "PD-RW research runtime: bounded state/evidence audit, MCP, operational receipts and guarded previews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
pdrw-agent = "pdrw_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdrw_agent*"]
