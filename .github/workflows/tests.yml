name: skill-runtime-mcp-tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local runtime and MCP v2 dependency
        run: python -m pip install -e ".[mcp]"
      - name: Run all offline framework and real in-memory MCP tests
        run: python -m unittest discover -s tests -v
      - name: Validate Skill ZIP
        run: python tools/package_skill.py
