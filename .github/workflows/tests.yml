name: pd-rw-agent-unit-and-integration-tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout PD-RW-Agent
        uses: actions/checkout@v4
      - name: Checkout pinned PD-RW authority for synthetic integration
        uses: actions/checkout@v4
        with:
          repository: phr-devil/Problem-Data-Research-Workflow
          ref: 68e29c367583d5c96ef70180819f8b3322ea840d
          path: pd-rw-fixture
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and pinned MCP SDK
        run: python -m pip install -e ".[mcp]"
      - name: Run cross-platform tests with original PD-RW backend
        env:
          PDRW_TEST_RULE_ROOT: ${{ github.workspace }}/pd-rw-fixture
        run: python -m unittest discover -s tests -v
      - name: Validate Skill ZIP package
        run: python tools/package_skill.py
